name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install ruff pip-audit pytest

      - name: Check lock satisfies requirements.txt
        run: |
          python - <<'PY'
          import re

          def canon(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def vkey(v):
              return tuple(int(p) for p in v.split(".") if p.isdigit())

          reqs = {}
          for line in open("requirements.txt", encoding="utf-8"):
              line = line.split("#", 1)[0].strip()
              m = re.match(r"^([A-Za-z0-9._-]+)\s*>=\s*([\w.+-]+)$", line)
              if m:
                  reqs[canon(m.group(1))] = (m.group(1), m.group(2))

          lock = {}
          for line in open("requirements-lock.txt", encoding="utf-8"):
              line = line.split("#", 1)[0].strip()
              # pip-locked entries are line-wrapped: the trailing backslash
              # would defeat the $-anchored regex (audit 2026-10-23 E-3 —
              # before this fix 0 of the 30 lock entries ever matched).
              line = line.rstrip("\\").strip()
              m = re.match(r"^([A-Za-z0-9._-]+)\s*==\s*([\w.+-]+)$", line)
              if m:
                  lock[canon(m.group(1))] = (m.group(1), m.group(2))

          errors = []
          for key, (name, min_v) in reqs.items():
              if key not in lock:
                  errors.append(f"{name}: requirements.txt 有但 lock 缺失")
                  continue
              lock_name, lock_v = lock[key]
              lv, mv = vkey(lock_v), vkey(min_v)
              n = max(len(lv), len(mv))
              lv = lv + (0,) * (n - len(lv))
              mv = mv + (0,) * (n - len(mv))
              if lv < mv:
                  errors.append(f"{name}: lock {lock_v} < 要求最低 {min_v}")
          if errors:
              print("requirements.txt 与 requirements-lock.txt 不一致:")
              for e in errors:
                  print("  -", e)
              raise SystemExit(1)
          print(f"OK: {len(reqs)} 个直接依赖全部满足 lock 最低版本")
          PY

      - name: Lint (ruff)
        run: ruff check backend/ tests/ tools/


      - name: Run unit tests
        # pytest (not unittest discover): tests/test_security_regression.py
        # imports pytest at top level (xfail markers) — discover used to
        # ModuleError out and the whole backend job skipped its tests
        # (audit 2026-10-20 P1-5).
        run: python -m pytest tests -q

      - name: Security audit (pip-audit)
        run: pip-audit -r requirements-lock.txt --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (tsc)
        working-directory: frontend
        run: npx tsc -b

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests (vitest)
        working-directory: frontend
        run: npm run test:ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vllm-dashboard:ci .

      # Audit 2026-10-22 INF-13: a green `docker build` only proves the
      # image *builds* — run it and poll /health so a container that
      # crashes at startup (bad entrypoint, missing data dir, frontend
      # bundle not wired) is caught here instead of in production.
      - name: Smoke test (run container + poll /health)
        run: |
          docker run -d --name vllm-dashboard-smoke -p 127.0.0.1:5199:5199 \
            -e API_HOST=0.0.0.0 -e API_PORT=5199 -e STATIC_DIR=/app/static \
            vllm-dashboard:ci
          for i in $(seq 1 12); do
            body=$(curl -s http://127.0.0.1:5199/health 2>/dev/null || true)
            case "$body" in
              *healthy*) echo "HEALTHY: $body"; break ;;
            esac
            if [ "$i" -eq 12 ]; then
              docker logs vllm-dashboard-smoke 2>&1 | tail -40
              echo "SMOKE FAILED: container not healthy after 60s"
              exit 1
            fi
            sleep 5
          done
          docker rm -f vllm-dashboard-smoke > /dev/null
