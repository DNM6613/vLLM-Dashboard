name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install ruff pip-audit

      - name: Check lock satisfies requirements.txt
        run: |
          python - <<'PY'
          import re

          def canon(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def vkey(v):
              return tuple(int(p) for p in v.split(".") if p.isdigit())

          reqs = {}
          for line in open("requirements.txt", encoding="utf-8"):
              line = line.split("#", 1)[0].strip()
              m = re.match(r"^([A-Za-z0-9._-]+)\s*>=\s*([\w.+-]+)$", line)
              if m:
                  reqs[canon(m.group(1))] = (m.group(1), m.group(2))

          lock = {}
          for line in open("requirements-lock.txt", encoding="utf-8"):
              line = line.split("#", 1)[0].strip()
              m = re.match(r"^([A-Za-z0-9._-]+)\s*==\s*([\w.+-]+)$", line)
              if m:
                  lock[canon(m.group(1))] = (m.group(1), m.group(2))

          errors = []
          for key, (name, min_v) in reqs.items():
              if key not in lock:
                  errors.append(f"{name}: requirements.txt 有但 lock 缺失")
                  continue
              lock_name, lock_v = lock[key]
              lv, mv = vkey(lock_v), vkey(min_v)
              n = max(len(lv), len(mv))
              lv = lv + (0,) * (n - len(lv))
              mv = mv + (0,) * (n - len(mv))
              if lv < mv:
                  errors.append(f"{name}: lock {lock_v} < 要求最低 {min_v}")
          if errors:
              print("requirements.txt 与 requirements-lock.txt 不一致:")
              for e in errors:
                  print("  -", e)
              raise SystemExit(1)
          print(f"OK: {len(reqs)} 个直接依赖全部满足 lock 最低版本")
          PY

      - name: Lint (ruff)
        run: ruff check backend/ tests/ setup.py tools/


      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Security audit (pip-audit)
        run: pip-audit -r requirements-lock.txt --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (tsc)
        working-directory: frontend
        run: npx tsc -b

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests (vitest)
        working-directory: frontend
        run: npm run test:ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vllm-dashboard:ci .
